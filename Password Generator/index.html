<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" /> 
    <title>Password Generator | Javascript Project</title>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>


        <div class="inputBox">
            <input type="text" class="passBox" id="passBox" disabled>
            <span class="material-symbols-outlined" id="copyBtn">
             content_copy
              </span>
        </div>

        <input type="range" min="1" max="30" value="8" id="inputSlider">

        <div class="row">
            <p>Password Length</p>
            <span id="sliderValue"></span>

        </div>
        <div class="row">
            <label for="uppercase">Include Uppercase Letters (A-Z)</label>
            <input type="checkbox" id="uppercase" name="uppercase"checked/>
      
            </div>

         
              <div class="row">
             <label for="lowercase">Include Lowercase Letters (a-z)</label>
            <input type="checkbox" id="lowercase" name="lowercase"checked/>
            </div>


              <div class="row">
             <label for="Numbers">Include Numbers (0-9)</label>
            <input type="checkbox" id="Numbers" name="Numbers"checked/>
            </div>


              <div class="row">
             <label for="Symbols">Include Symbols (@-$%&*)</label>
            <input type="checkbox" id="Symbols" name="Symbols"checked/>
            </div>
            
            <button type="button" class="genBtn" id="genBtn">Generate Password</button>

    </div>
           <script src="script.js"></script>
</body>
</html>
